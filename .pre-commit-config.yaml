repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        stages: [pre-commit]
        pass_filenames: false
        types: [ts]
      - id: prettier
        name: Prettier format check
        entry: npm run format:check
        language: system
        stages: [pre-commit]
        pass_filenames: false
        types: [ts]

      # Secret scanning at PUSH time. This extension ships on the VS Code
      # Marketplace and the repo is public, so a credential reaching main is
      # world-readable at once -- and CI here runs no secret scanning at all.
      - id: gitleaks-push
        name: Secret scan the commits being pushed (gitleaks)
        entry: scripts/hooks/gitleaks-push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

# A hook with no `stages` runs at every stage, so the hooks above are pinned to
# pre-commit and the scan to pre-push.
default_install_hook_types: [pre-commit, pre-push]
