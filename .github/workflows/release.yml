name: Release VS Code Extension

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v0.1.0, v1.0.0

# Default to read-only. Build and package don't need write -- only the
# final ``Create Release`` step in the build job and the marketplace
# publish job need their respective scoped writes.
permissions:
  contents: read

# Only one release at a time per tag. Don't cancel in progress -- a
# half-complete marketplace publish leaves users in a bad state.
concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Refuse to build a release nobody can read the notes for. A separate job
  # that `build` needs, rather than a step inside it, so a missing entry
  # costs seconds instead of a full build-and-package run.
  notes-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require a CHANGELOG section for this tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *)
              echo "::notice::$GITHUB_REF_NAME is not a version tag -- skipping."
              exit 0
              ;;
          esac
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          # Present-but-empty is the failure mode to catch, not just a missing
          # heading -- test for content.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$ver]' section."
            echo "::error::Write the release notes for $ver, then re-tag."
            exit 1
          fi
          echo "Release notes for $ver:"
          cat notes.md

  build:
    name: Build and Package Extension
    needs: notes-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs write to push the GitHub Release at the end.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package.json version
        # Same check as the publish job, but it must ALSO run here: this job
        # creates the GitHub Release, and a tag/manifest mismatch would
        # otherwise attach a wrongly-versioned .vsix to the release before
        # the publish-job check ever runs.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json version."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Tests
        # ubuntu runner is headless; xvfb provides the display VS Code needs.
        run: xvfb-run -a npm test

      - name: Package extension
        # vsce is a pinned devDependency (installed by `npm ci`), not a
        # floating global install.
        run: npx vsce package --no-dependencies
        id: package

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension
          path: '*.vsix'
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: PromptGuard VS Code Extension v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## PromptGuard VS Code Extension v${{ steps.get_version.outputs.VERSION }}

            Drop-in LLM security for your applications - directly in VS Code.

            ### Installation

            **From VS Code Marketplace**:
            1. Open VS Code
            2. Go to Extensions (Cmd+Shift+X / Ctrl+Shift+X)
            3. Search for "PromptGuard"
            4. Click Install

            **From VSIX file**:
            1. Download the `.vsix` file below
            2. In VS Code: View → Command Palette → "Extensions: Install from VSIX..."
            3. Select the downloaded file

            ### Features

            - ✅ LLM SDK detection with real-time diagnostics
            - ✅ Status bar indicator
            - ✅ One-click initialization
            - ✅ Seamless CLI integration
            - ✅ Support for TypeScript, JavaScript, and Python

            ### Requirements

            - VS Code 1.80.0 or higher
            - PromptGuard CLI installed (see [CLI releases](https://github.com/acebot712/promptguard-cli/releases))

            ---

            📖 **Documentation**: https://docs.promptguard.co
            🏠 **Homepage**: https://promptguard.co
            🐛 **Issues**: https://github.com/promptguard/promptguard-vscode/issues
          files: '*.vsix'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    # Marketplace auth is via VSCE_PAT, no GITHUB_TOKEN write needed.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches package.json version
        # `vsce publish` publishes whatever version package.json declares --
        # a tag/manifest mismatch would silently ship the wrong version to
        # the marketplace under a release tag that claims otherwise.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag $TAG matches package.json version."

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'

      # Still needed, but only for the `vsce` binary itself -- it is a pinned
      # devDependency rather than a floating global install. Nothing here
      # compiles: the artifact being published was built and tested in `build`.
      - name: Install dependencies
        run: npm ci

      # PUBLISH THE ARTIFACT `build` PRODUCED, not a fresh one.
      #
      # This job used to re-checkout, re-install, re-compile and then run
      # `vsce publish`, which REPACKAGES from source. So the .vsix attached to
      # the GitHub Release and the .vsix on the Marketplace were two
      # independent builds of the same tag -- and only the first had been
      # through `npm run lint`, `npm run compile` and the xvfb test run in
      # `build`. Users installed a binary nothing had verified, and any
      # non-reproducibility between the two builds was invisible by
      # construction.
      #
      # Downloading the artifact makes the tested bytes the published bytes.
      - name: Download the built extension
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: extension

      - name: Publish to VS Code Marketplace
        # `--packagePath` publishes this exact file. Without it `vsce publish`
        # would build its own, which is the bug above.
        run: |
          set -euo pipefail
          # Exactly one .vsix, or the glob below would silently pick one of
          # several and publish a file nobody chose.
          count=$(find . -maxdepth 1 -name '*.vsix' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one .vsix from the build artifact, found $count" >&2
            exit 1
          fi
          vsix=$(find . -maxdepth 1 -name '*.vsix')
          echo "Publishing $vsix"
          npx vsce publish --no-dependencies --packagePath "$vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

